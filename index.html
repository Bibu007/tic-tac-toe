<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header main-element"><h1>Tic Tac Toe</h1></div>
    <div class="container">
        <div class="info main-element">
            <div class="versus"></div>
            <div class="turn"></div>
            <div class="utility-btns">
                <button class="set-names utility">Set names</button>
                <dialog class="set-names-dialog">
                <h3>Enter Player Names</h3>
                <form id="add-players" action="">
                    <p class="form-item">
                        <label for="One">Player 1</label>
                        <input type="text" name="one" required>
                    </p>
                    <p class="form-item">
                        <label for="Two">Player 2</label>
                        <input type="text" name="two" required>
                    </p>
                </form>
                <div class="form-btn">
                        <button type="submit" form="add-players">Add</button>
                        <button id="close">Close</button>
                    </div>
            </dialog>
                <button class="undo utility">Undo</button>
                <button class="restart utility">Restart</button>
            </div>
        </div>
        <div class="grid-container main-element">
            <div class="grid"></div>
        </div>
        <dialog class="winner">
            <div class="winner-text"></div>
            <button class="dialog-restart">Restart</button>
        </dialog>
    </div>
</body>
</html>
