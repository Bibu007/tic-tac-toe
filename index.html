<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header main-element"><h1>Tic Tac Toe</h1></div>
    <div class="container">
        <div class="info main-element">
            <div class="versus"></div>
            <div class="turn"></div>
            <div class="utility-btns">
                <button class="set-names utility">Set names</button>
                <button class="undo utility">Undo</button>
                <button class="start-over utility">Start over</button>
            </div>
        </div>
        <div class="grid-container main-element">
            <div class="grid"></div>
        </div>
    </div>
</body>
</html>
